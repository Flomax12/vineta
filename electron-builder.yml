appId: cl.flomac.vineta
productName: Viñeta
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  executableName: Vineta
  icon: build/icono.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Viñeta
  artifactName: Vineta-Setup-${version}.${ext}
